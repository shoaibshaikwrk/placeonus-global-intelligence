name: Refresh intelligence data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-intelligence-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect current intelligence
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          VESSELFINDER_API_KEY: ${{ secrets.VESSELFINDER_API_KEY }}
          VESSELFINDER_IMOS: ${{ secrets.VESSELFINDER_IMOS }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python collector.py

      - name: Commit changed snapshots
        run: |
          git config user.name 'placeonus-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'data: refresh intelligence snapshots'
          git pull --rebase origin main
          git push origin main
